<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Wellframe Clinic</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#17847a"/><path d="M6 16h5l2-6 4 12 3-8 2 2h4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Wellframe Clinic
    </a>
    <div class="nav-cta"><a href="login.html" class="btn btn-outline btn-sm">Log in</a></div>
  </div>
</nav>

<div class="auth-shell">
  <div class="container">
    <div class="card form-card">
      <span class="eyebrow">Security</span>
      <h2>Set a new password</h2>
      <p style="font-size:0.9rem; color:var(--ink-600); margin-bottom:16px;">Please choose a strong password with at least 6 characters.</p>
      <div id="reset-msg"></div>
      
      <form id="reset-form" novalidate>
        <div class="form-row">
          <label for="new_password">New Password</label>
          <input id="new_password" name="new_password" type="password" required minlength="6" placeholder="••••••••">
        </div>
        <div class="form-row">
          <label for="confirm_password">Confirm New Password</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="6" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Update Password</button>
      </form>
      <div class="auth-switch mt-16"><a href="login.html">Return to Log in</a></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');
const msgHost = document.getElementById('reset-msg');
const resetForm = document.getElementById('reset-form');

if (!token) {
  msgHost.innerHTML = '<div class="form-msg error">Invalid or missing reset token. Please request a new password reset link.</div>';
  resetForm.style.display = 'none';
}

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgHost.innerHTML = '';
  const newPass = document.getElementById('new_password').value;
  const confirmPass = document.getElementById('confirm_password').value;

  if (newPass !== confirmPass) {
    msgHost.innerHTML = '<div class="form-msg error">Passwords do not match. Please re-enter.</div>';
    return;
  }

  const btn = resetForm.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Updating…';

  try {
    const res = await api('/auth/reset-password', {
      method: 'POST',
      auth: false,
      body: { token, new_password: newPass }
    });
    msgHost.innerHTML = `<div class="form-msg success">${res.message} Redirecting to login in 3 seconds...</div>`;
    resetForm.reset();
    setTimeout(() => { window.location.href = 'login.html'; }, 3000);
  } catch (err) {
    msgHost.innerHTML = `<div class="form-msg error">${err.message}</div>`;
    btn.disabled = false;
    btn.textContent = 'Update Password';
  }
});
</script>
</body>
</html>
